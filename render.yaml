services:
  - type: web
    name: morocco-rental-price-api
    runtime: python
    plan: free
    rootDir: ml/price_prediction
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
